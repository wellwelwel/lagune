name: '🔬 CI — Test'

on:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - 'src/**'
      - 'skills/**'
      - 'catalog/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'test/**'
      - 'tools/**'
      - 'website/docs/**'
      - 'assets/**'
      - '.*-plugin/**'
      - '.plugin/**'
      - '.agents/**'
      - '*-extension.json'
      - '.github/release/**'
      - '.github/workflows/ci_test.yml'
      - 'README.md'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  node:
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: ${{ matrix.os.timeout }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
        os:
          - { name: Linux, runner: ubuntu-latest, timeout: 5 }
          - { name: macOS, runner: macos-latest, timeout: 10 }
          - { name: Windows, runner: windows-latest, timeout: 15 }
    name: Node.js ${{ matrix.node-version }} on ${{ matrix.os.name }}
    defaults:
      run:
        # On Windows, the npm scripts need Git Bash rather than the WSL launcher in System32
        shell: bash
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v6

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Installing Dependencies
        run: npm ci

      - name: 🔬 Node ${{ matrix.node-version }}
        run: npm test

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Skills discovery
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v6

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: lts/*

      - name: 🧩 Listing the published skills
        run: bash scripts/skills/discovery.sh
