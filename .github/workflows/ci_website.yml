name: '📒 CI (Website) — Build'

on:
  pull_request:
    paths:
      - 'website/**'
      - 'src/dashboard/client/public/**'
      - 'src/dashboard/shared/**'
      - 'src/hooks/skills/**'
      - 'src/providers/**'
      - 'src/types/**'
      - '.github/workflows/ci_website.yml'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Check
    steps:
      - name: Actions - Checkout
        uses: actions/checkout@v6

      - name: Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: lts/*

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-linux-

      - name: Installing Dependencies
        run: npm ci

      - name: Checking Types
        run: npm -w website run typecheck

      - name: Checking Build
        run: npm run website:build
