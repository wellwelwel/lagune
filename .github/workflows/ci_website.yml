name: '📒 CI (Website) — Build'

on:
  pull_request:
    paths:
      - 'website/**'
      - 'schemas/**'
      - 'src/dashboard/client/public/**'
      - 'src/dashboard/shared/**'
      - 'src/catalog/**'
      - 'src/categories/**'
      - 'src/types/**'
      - 'src/cli/**'
      - 'src/mcp/**'
      - 'tools/i18n/**'
      - '.github/workflows/ci_website.yml'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Check
    steps:
      - name: Actions - Checkout
        uses: actions/checkout@v6

      - name: Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: lts/*

      - name: Actions - Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-linux-

      - name: Cache Website Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ hashFiles('website/bun.lock') }}
          restore-keys: bun-linux-

      - name: Installing Dependencies
        run: npm ci

      - name: Installing Website Dependencies
        working-directory: website
        run: bun ci

      - name: Checking Types
        working-directory: website
        run: bun run typecheck

      - name: Checking Translations
        working-directory: website
        continue-on-error: true
        run: bun run i18n:check

      - name: Checking Build
        working-directory: website
        run: bun run build
