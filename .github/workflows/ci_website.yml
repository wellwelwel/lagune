name: '📒 CI (Website) — Build'

on:
  pull_request:
    paths:
      - 'website/**'
      - 'schemas/**'
      - 'src/dashboard/client/public/**'
      - 'src/dashboard/shared/**'
      - 'src/catalog/**'
      - 'src/categories/**'
      - 'src/types/**'
      - 'src/cli/**'
      - 'src/mcp/**'
      - 'tools/i18n/**'
      - '.github/workflows/ci_website.yml'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Check
    steps:
      - name: Actions - Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Actions - Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          check-latest: true
          node-version: lts/*

      - name: Actions - Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-linux-

      - name: Cache Website Dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ hashFiles('website/bun.lock') }}
          restore-keys: bun-linux-

      - name: Installing Dependencies
        run: npm ci

      - name: Installing Website Dependencies
        working-directory: website
        run: bun ci

      - name: Checking Types
        working-directory: website
        run: bun run typecheck

      - name: Checking Translations
        working-directory: website
        continue-on-error: true
        run: bun run i18n:check

      - name: Checking Build
        working-directory: website
        run: bun run build
