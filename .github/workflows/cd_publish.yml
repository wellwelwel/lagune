name: '🚀 CD — Publish'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

jobs:
  check-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.repository.fork == false
    name: Check the Engine Pin
    permissions:
      contents: read
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: lts/*

      - name: 📌 Checking the Engine Pin
        run: |
          node tools/pin-engine.ts
          git diff --exit-code -- skills catalog

  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check-pin
    if: github.event.repository.fork == false
    name: Release Please
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 🤝 Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release/config.json
          manifest-file: .github/release/manifest.json

      - name: ➕ Actions - Checkout
        uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          check-latest: true
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - name: ➕ Cache dependencies
        uses: actions/cache@v5
        if: ${{ steps.release.outputs.release_created }}
        with:
          path: ~/.npm
          key: npm-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-linux-

      - name: 📦 Installing Dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: 🚀 Building the Project
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: 📥 Publishing Package
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --provenance

      - name: 📦 Keeping the Engine Build for the Plugin Branches
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-artifact@v7
        with:
          name: engine
          path: lib
          if-no-files-found: error
          retention-days: 1

      - name: 🚀 Building Site
        if: ${{ steps.release.outputs.release_created }}
        run: npm run website:build

      - name: 📤 Deploying Site
        if: ${{ steps.release.outputs.release_created }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          cname: lagune.ai
          publish_branch: 'website'
          allow_empty_commit: false

  plugin-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: Publish the Plugin Branches
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ['claude']
    env:
      PLUGIN: ${{ matrix.plugin }}
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: lts/*

      - name: 📥 Restoring the Engine Build
        uses: actions/download-artifact@v8
        with:
          name: engine
          path: lib

      - name: 🧩 Assembling the Plugin Bundle
        run: bash scripts/plugins/bundle.sh "$PLUGIN" "$RUNNER_TEMP/plugin-$PLUGIN"

      - name: 📤 Publishing the Plugin Branch
        run: node tools/publish-branch.ts "plugin-$PLUGIN" "$RUNNER_TEMP/plugin-$PLUGIN" "$VERSION ($GITHUB_SHA)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}

  pin-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    name: Pin the Engine
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: lts/*

      - name: 📌 Pinning the Engine to the Release Version
        run: node tools/pin-engine.ts

      - name: 📤 Pushing the Pin to the Release Pull Request
        run: |
          git add skills catalog
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --message 'chore: pin the engine to the release version'
          git push origin "HEAD:$RELEASE_BRANCH"
