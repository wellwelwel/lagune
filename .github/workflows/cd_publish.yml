name: '🚀 CD — Publish'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  check-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.repository.fork == false
    name: Check the Engine Pin
    permissions:
      contents: read
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          check-latest: true
          node-version: lts/*

      - name: 📌 Checking the Engine Pin
        run: |
          node tools/pin-engine.ts
          git diff --exit-code -- skills catalog

  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check-pin
    if: github.event.repository.fork == false
    name: Release Please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 🤝 Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release/config.json
          manifest-file: .github/release/manifest.json

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: Publish the Package
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          check-latest: true
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - name: ➕ Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-linux-

      - name: 📦 Installing Dependencies
        run: npm ci

      - name: 🚀 Building the Project
        run: npm run build

      - name: 📥 Publishing Package
        run: npm publish --provenance

      - name: 📦 Keeping the Engine Build for the Plugin Branches
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine
          path: lib
          if-no-files-found: error
          retention-days: 1

  website:
    needs: [release-please, package]
    if: needs.release-please.outputs.release_created == 'true'
    name: Deploy the Website
    permissions:
      contents: write
    uses: ./.github/workflows/cd_website.yml

  plugin-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release-please, package]
    if: needs.release-please.outputs.release_created == 'true'
    name: Publish the Plugin Branches
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ['antigravity', 'claude', 'cursor', 'droid', 'grok', 'hermes']
    env:
      PLUGIN: ${{ matrix.plugin }}
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          check-latest: true
          node-version: lts/*

      - name: 📥 Restoring the Engine Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: lib

      - name: 🧩 Assembling the Plugin Bundle
        run: bash scripts/plugins/bundle.sh "$PLUGIN" "$RUNNER_TEMP/plugin-$PLUGIN"

      - name: 📤 Publishing the Plugin Branch
        run: node tools/publish-branch.ts "plugin-$PLUGIN" "$RUNNER_TEMP/plugin-$PLUGIN" "$VERSION ($GITHUB_SHA)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}

  plugin-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release-please, package]
    if: needs.release-please.outputs.release_created == 'true'
    name: Attach the Plugin Archives to the Release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ['gemini']
    env:
      PLUGIN: ${{ matrix.plugin }}
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 📥 Restoring the Engine Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: lib

      - name: 🧩 Assembling the Plugin Bundle
        run: bash scripts/plugins/bundle.sh "$PLUGIN" "$RUNNER_TEMP/plugin-$PLUGIN"

      # Gemini CLI installs the release asset named after the user's platform before the source archive
      - name: 📤 Attaching the Plugin Archives
        run: |
          for platform in darwin linux win32; do
            tar -czf "$RUNNER_TEMP/$platform.lagune.tar.gz" -C "$RUNNER_TEMP/plugin-$PLUGIN" .
          done
          gh release upload "$TAG" "$RUNNER_TEMP"/*.lagune.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  pin-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    name: Pin the Engine
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          check-latest: true
          node-version: lts/*

      - name: 📌 Pinning the Engine to the Release Version
        run: node tools/pin-engine.ts

      - name: 📤 Pushing the Pin to the Release Pull Request
        run: |
          git add skills catalog
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --message 'chore: pin the engine to the release version'
          git push origin "HEAD:$RELEASE_BRANCH"
